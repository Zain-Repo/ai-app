name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      windows_release_ready: ${{ steps.windows-release.outputs.ready }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate workflow YAML
        run: bunx prettier --check .github/workflows/*.yml

      - name: Type-check
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Check whether Windows release is ready
        id: windows-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $packageVersion = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $tag = "v$packageVersion"
          $isDraft = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft --jq '.isDraft' 2>$null

          if ($LASTEXITCODE -eq 0) {
            $ready = $isDraft.Trim() -eq "true"
          } else {
            gh repo view $env:GITHUB_REPOSITORY --json nameWithOwner | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Could not verify the target GitHub repository."
            }
            $ready = $true
          }

          "Windows release $tag ready: $ready"
          "ready=$($ready.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  release-windows:
    name: Release Windows desktop app
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.validate.outputs.windows_release_ready == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      commit_sha: ${{ github.sha }}
